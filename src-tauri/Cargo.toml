[package]
name = "my-daily-standup"
version = "0.0.0"
description = "Private, local-first desktop planning companion with on-demand local AI standups."
authors = ["Wasif Saeed"]
license = "MIT"
repository = "https://github.com/Wasif0410/My-Daily-Standup"
edition = "2021"
rust-version = "1.77.2"

# The library is what the integration tests and the binary both consume, so
# logic lives here rather than in main.rs.
[lib]
name = "my_daily_standup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# No doctests: this crate exposes a Tauri app, not a documented public API.
doctest = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"
uuid = { version = "1.24.1", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
