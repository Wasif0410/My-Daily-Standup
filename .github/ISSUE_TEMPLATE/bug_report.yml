name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **Please do not paste vault contents into this issue.** If the bug involves a
        specific note, reduce it to a minimal synthetic example first.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Weekly Tasks board
        2. Drag a task to Thursday
        3. Restart the app
        4. The task is back on Monday
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, or the commit SHA if running from source.
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: profile
    attributes:
      label: Hardware profile
      options:
        - Lightweight
        - Balanced
        - High Quality
        - Not sure / not applicable
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: OS version, RAM, and GPU with VRAM.
      placeholder: "Windows 11 26200, 32 GB RAM, RTX 3070 Ti 8 GB"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any relevant error output. Redact anything personal.
      render: shell

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: This issue contains no personal notes or vault contents
          required: true
        - label: I searched existing issues for a duplicate
          required: true
