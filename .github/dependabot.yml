version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (the native rewrite) is ahead of the lint ecosystem: no
      # typescript-eslint release supports it, so taking a major bump would
      # silently disable type-aware linting. Minor and patch 5.x updates still
      # come through. Revisit when typescript-eslint declares TS 7 support.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per ecosystem cluster keeps the sequential PR workflow from
      # being buried under a dozen single-dependency bumps.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns:
          [
            "eslint*",
            "@eslint/*",
            "typescript-eslint",
            "prettier",
            "vitest",
            "@vitest/*",
            "@testing-library/*",
          ]
      tauri:
        patterns: ["@tauri-apps/*"]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["tauri", "tauri-build"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
